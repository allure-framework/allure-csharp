"theme:workflow":
  - changed-files:
    - any-glob-to-any-file: ".github/**"

"theme:build":
  - changed-files:
    - any-glob-to-any-file:
      - "*.slnx"
      - "**/*.csproj"
      - "**/Directory.Build.props"
      - "**/Directory.Build.targets"
      - "build/**/*"
      - ".gitignore"

"theme:core":
  - changed-files:
    - any-glob-to-any-file:
      - "src/Allure.Net.Commons/**"
      - "tests/Allure.Net.Commons.Tests/**"

"theme:xunit":
  - changed-files:
    - any-glob-to-any-file:
      - "src/Allure.Xunit/**"
      - "examples/Allure.Xunit.Examples/**"

"theme:nunit":
  - changed-files:
    - any-glob-to-any-file:
      - "src/Allure.NUnit/**"
      - "examples/Allure.NUnit.Examples/**"

"theme:specflow":
  - changed-files:
    - any-glob-to-any-file:
      - "src/Allure.SpecFlow/**"
      - "tests/Allure.SpecFlow.Tests/**"
      - "tests/Allure.SpecFlow.Tests.Samples/**"

"theme:reqnroll":
  - changed-files:
    - any-glob-to-any-file:
      - "src/Allure.Reqnroll/**"
      - "tests/Allure.Reqnroll.Tests/**"
      - "tests/Allure.Reqnroll.Tests.Samples/**"
